<!doctype html>
<html><head><title>Table layout, unlinked labels</title></head><body>
<table>
  <tr><td>Email</td><td><input type="text" name="a"></td></tr>
  <tr><td>First Name</td><td><input type="text" name="b" placeholder="Name"></td></tr>
  <tr><td>Last Name</td><td><input type="text" name="c" placeholder="Surname"></td></tr>
  <tr><td>Gender</td><td><input type="radio" name="d"> Male <input type="radio" name="d"> Female</td></tr>
  <tr><td>State</td><td><select name="e"><option>-- Select --</option><option>India</option><option>Japan</option></select></td></tr>
</table>
</body></html>
