<!doctype html>
<html><head><title>Reordered fields</title></head><body>
<form>
  <div><label for="s1">State</label>
    <select id="s1" name="s1"><option>-- Select --</option><option>India</option><option>Japan</option></select></div>
  <div><label for="e1">Email</label> <input id="e1" name="e1" type="text"></div>
  <div><label>Gender</label>
    <div><input type="radio" name="g1" id="g_a" value="a"> Male <input type="radio" name="g1" id="g_b" value="b"> Female</div></div>
  <div><label for="l1">Last Name</label> <input id="l1" name="l1" type="text" placeholder="Surname"></div>
  <div><label for="f1">First Name</label> <input id="f1" name="f1" type="text" placeholder="Name"></div>
</form></body></html>
